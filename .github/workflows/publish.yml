name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="${TAG_NAME#v}"
          test -n "$package_version"
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore MonixOne.Infisical.Configuration.sln --disable-parallel

      - name: Build
        run: >-
          dotnet build MonixOne.Infisical.Configuration.sln --configuration Release --no-restore
          --disable-build-servers -m:1 -p:GeneratePackageOnBuild=false

      - name: Test
        run: >-
          dotnet test MonixOne.Infisical.Configuration.sln --configuration Release --no-build --no-restore
          --disable-build-servers -m:1

      - name: Pack
        run: >-
          dotnet pack src/MonixOne.Infisical.Configuration/MonixOne.Infisical.Configuration.csproj
          --configuration Release --no-build --output artifacts/nuget
          -p:GeneratePackageOnBuild=false -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        env:
          NUGET_TEMPORARY_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet nuget push "artifacts/nuget/MonixOne.Infisical.Configuration.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_TEMPORARY_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
